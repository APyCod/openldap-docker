name: CI & GHCR Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Rebuild monthly on the 1st at 03:00 UTC to pick up Alpine/OpenLDAP security patches
    - cron: '0 3 1 * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DOCKER_IMAGE: ghcr.io/apycod/openldap-docker

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run tests
        run: ./tests/run_test.sh

  publish:
    name: Build and push to GHCR
    needs: test
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract OpenLDAP version from Dockerfile
        id: version
        run: |
          raw_version=$(grep -E '^ENV OPENLDAP_VERSION=' Dockerfile | head -n1 | cut -d'=' -f2 | tr -d '[:space:]"')
          version="${raw_version%%-*}"
          series="${version%.*}"
          echo "raw=${raw_version}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "series=${series}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: true
          no-cache: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.series }}
            ${{ env.DOCKER_IMAGE }}:latest
